<!DOCTYPE html>
<html>
<head><title>Beneath Sunden — Skirmish</title></head>
<body>
<!--
  Story 162-11 — the CONSISTENT-naming companion to fixture_identity_fork_realdom.html.
  Same accessibility subtree (region "Enemies" > `roster-vs` "vs" text node +
  role="list" > role="listitem" > aria-hidden decorative portrait beside the
  name span; role="log" narration), and the same deliberate omissions — read
  that fixture's header for the full reproduced / NOT-reproduced inventory,
  including why the region carries no data-testid. Only the prose differs here:
  the narration names the foe the SAME way the panel does ("the Thief"), so the
  detector must NOT flag a fork.

  This is the fixture-fidelity guard the review asked for: it fires a FALSE fork
  the instant the fixture drifts back to a non-aria-hidden portrait (`listitem:
  T Thief` vs. prose "the Thief"), so the paired wiring test fails loudly if the
  fixture stops reproducing the part of the shipped DOM the detector reads.
-->

<div role="region" aria-label="Enemies">
  <span data-testid="roster-vs">vs</span>
  <span role="list">
    <span role="listitem">
      <div data-testid="actor-portrait" title="Thief — thug" aria-hidden="true">T</div>
      <span>Thief</span>
    </span>
  </span>
</div>

<div data-testid="narration-scroll" role="log" aria-live="polite">
  <div class="narration-body">
    <p>The Thief lunges at you from the dark.</p>
  </div>
</div>

<label for="action">Action</label>
<textarea id="action"></textarea>
<button id="send">Send</button>
<script>
  document.getElementById("send").addEventListener("click", () => {
    const box = document.getElementById("action");
    const p = document.createElement("p");
    p.textContent = "The Thief presses the attack.";
    document.querySelector('[data-testid="narration-scroll"] .narration-body').appendChild(p);
    box.value = "";
  });
</script>
</body>
</html>
