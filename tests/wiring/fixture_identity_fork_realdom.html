<!DOCTYPE html>
<html>
<head><title>Beneath Sunden — Ambush</title></head>
<body>
<!--
  Story 162-11 — a FAITHFUL reproduction of the real sidequest-ui confrontation
  + narration DOM as it ships after the fix, unlike the idealized
  fixture_identity_fork.html (<section aria-label="Enemies"><ul><li>Thief</li></ul>).

  In the live UI (ConfrontationOverlay.tsx / NarrationScroll.tsx):
    * The foe is an ActorChip — a portrait <div> beside a name <span>. The
      shipped chip is aria-hidden (decorative), so the listitem's accessible
      name is the clean foe name — this fixture MUST carry that aria-hidden or it
      would emit `listitem: T Thief` and stop reproducing what ships (the
      day-one fixture divergence the review caught).
    * The foe listitems sit inside a role="list" parent (WCAG 1.3.1
      aria-required-parent), so aria_snapshot interposes a `- list:` line
      between the region and the listitem. `_enemy_labels` walks by indent and
      collects only listitem matches, so it skips that line — but the fixture
      carries the wrapper anyway, because "faithful reproduction" has to be
      true, not approximately true.
    * The narration is a scroll container that accumulates beats.

  This fixture applies the 162-11 target ARIA roles (region "Enemies",
  role="listitem", role="log" aria-live) ON TOP of that real structure, so the
  wiring test drives the REAL perceive() -> aria_snapshot -> detector path over
  the CLEAN `listitem: Thief` the shipped component produces.
-->

<!-- Enemies region — scoped to FOES ONLY (mirrors the ThemPanel / opponent
     group), so the detector sees exactly one foe. -->
<div data-testid="confrontation-them-panel" role="region" aria-label="Enemies">
  <span role="list">
    <span role="listitem">
      <div data-testid="actor-portrait" title="Thief — thug" aria-hidden="true">T</div>
      <span>Thief</span>
    </span>
  </span>
</div>

<!-- Narration stream — a polite log live-region. The narrated foe is named
     "Molgrath the Eyeless": two names, one enemy. -->
<div data-testid="narration-scroll" role="log" aria-live="polite">
  <div class="narration-body">
    <p>Molgrath the Eyeless lunges at you from the dark.</p>
  </div>
</div>

<label for="action">Action</label>
<textarea id="action"></textarea>
<button id="send">Send</button>
<script>
  document.getElementById("send").addEventListener("click", () => {
    const box = document.getElementById("action");
    // The fork persists across turns: the story keeps calling the Thief "Molgrath".
    const p = document.createElement("p");
    p.textContent = "Molgrath the Eyeless presses the attack.";
    document.querySelector('[data-testid="narration-scroll"] .narration-body').appendChild(p);
    box.value = "";
  });
</script>
</body>
</html>
