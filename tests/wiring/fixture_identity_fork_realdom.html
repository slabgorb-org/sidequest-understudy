<!DOCTYPE html>
<html>
<head><title>Beneath Sunden — Ambush</title></head>
<body>
<!--
  Story 162-11 (RED) — a FAITHFUL reproduction of the real sidequest-ui
  confrontation + narration DOM, unlike the idealized fixture_identity_fork.html
  (<section aria-label="Enemies"><ul><li>Thief</li></ul></section>).

  In the live UI (ConfrontationOverlay.tsx / NarrationScroll.tsx):
    * The foe is an ActorChip — a portrait <div> (name only in its `title`) beside
      a name <span>. The name is NOT a bare text child of the list item.
    * The narration is a scroll container that accumulates beats.

  This fixture applies the 162-11 target ARIA roles (region "Enemies",
  role="listitem", role="log" aria-live) ON TOP of that real structure, so the
  wiring test drives the REAL perceive() -> aria_snapshot -> detector path — not
  the idealized shape the detector was first written against.
-->

<!-- Enemies region — scoped to FOES ONLY (mirrors the ThemPanel / opponent
     group), so the detector sees exactly one foe. -->
<div data-testid="confrontation-them-panel" role="region" aria-label="Enemies">
  <span role="listitem">
    <div data-testid="actor-portrait" title="Thief — thug">T</div>
    <span>Thief</span>
  </span>
</div>

<!-- Narration stream — a polite log live-region. The narrated foe is named
     "Molgrath the Eyeless": two names, one enemy. -->
<div data-testid="narration-scroll" role="log" aria-live="polite">
  <div class="narration-body">
    <p>Molgrath the Eyeless lunges at you from the dark.</p>
  </div>
</div>

<label for="action">Action</label>
<textarea id="action"></textarea>
<button id="send">Send</button>
<script>
  document.getElementById("send").addEventListener("click", () => {
    const box = document.getElementById("action");
    // The fork persists across turns: the story keeps calling the Thief "Molgrath".
    const p = document.createElement("p");
    p.textContent = "Molgrath the Eyeless presses the attack.";
    document.querySelector('[data-testid="narration-scroll"] .narration-body').appendChild(p);
    box.value = "";
  });
</script>
</body>
</html>
